name: Collect Qidian monthly rankings

on:
  schedule:
    # 23:40 Asia/Shanghai (UTC+8) on days that can be month end.
    - cron: '40 15 28-31 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the live charts without publishing archive data
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: qidian-monthly-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      RUN_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run parser and archive tests
        run: npm test

      - name: Collect rankings
        run: |
          if [ "$RUN_DRY" = "true" ]; then
            npm run collect:dry
          else
            npm run collect:month
          fi

      - name: Commit a new monthly archive
        if: ${{ env.RUN_DRY != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/monthly data/manifest.json
          if git diff --cached --quiet; then
            echo "No new monthly archive to commit."
            exit 0
          fi
          git commit -m "data: add Qidian monthly archive"
          git push origin HEAD:main
